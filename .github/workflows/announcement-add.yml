name: Add Announcement

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Announcement Title"
        required: true
        type: string
      content:
        description: "Announcement Content"
        required: true
        type: string
      date:
        description: 'Date "YYYY-MM-DD HH:MM" Munich time (leave empty for now)'
        required: false
        type: string

jobs:
  add-announcement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Add announcement
        # inputs go through env, never interpolated into the script (shell injection)
        run: node scripts/content.mjs add-announcement "$TITLE" "$CONTENT" "$DATE"
        env:
          TITLE: ${{ github.event.inputs.title }}
          CONTENT: ${{ github.event.inputs.content }}
          DATE: ${{ github.event.inputs.date }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add announcement: ${{ github.event.inputs.title }}"
          title: "Add announcement: ${{ github.event.inputs.title }}"
          body: |
            ## New Announcement Added

            **Title:** ${{ github.event.inputs.title }}
            **Content:** ${{ github.event.inputs.content }}
            **Date:** ${{ github.event.inputs.date || 'now' }}

            This PR was automatically created by the Add Announcement workflow.
          branch: "add-announcement-${{ github.run_id }}"
          delete-branch: true
