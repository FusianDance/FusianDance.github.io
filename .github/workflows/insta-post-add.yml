name: Add Instagram Post

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Instagram post URL, e.g. https://www.instagram.com/p/ABC123/"
        required: true
        type: string

jobs:
  add-insta-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Add post
        # input goes through env, never interpolated into the script (shell injection)
        run: node scripts/content.mjs add-post "$URL"
        env:
          URL: ${{ github.event.inputs.url }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add Instagram post"
          title: "Add Instagram post"
          body: |
            ## New Instagram Post Added

            This PR adds a new Instagram post to the gallery.

            **URL:** ${{ github.event.inputs.url }}

            This PR was automatically created by the Add Instagram Post workflow.
          branch: "add-insta-post-${{ github.run_id }}"
          delete-branch: true
