name: Build and Lint

on:
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/workflows/build.yml'
  workflow_call:
    inputs:
      static_export:
        description: 'Build for static export (GitHub Pages)'
        required: false
        default: false
        type: boolean
      additional_build_env:
        description: 'additional environment variables for build step'
        required: false
        default: ''
        type: string
      ref:
        description: 'Git ref to build (default: triggering commit)'
        required: false
        default: ''
        type: string

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run content script tests
        run: node --test "scripts/*.test.mjs"

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Build application
        run: |
          # Export additional environment variables if provided
          export ${{ inputs.additional_build_env }}
          npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts (standard build)
        if: ${{ !inputs.static_export }}
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: .next/
          retention-days: 1

      - name: Upload build artifacts (static export)
        if: ${{ inputs.static_export }}
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out/
          retention-days: 1
