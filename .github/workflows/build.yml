name: Build and Lint

on:
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!.github/**"
      - ".github/workflows/build.yml"
  workflow_call:
    inputs:
      additional_build_env:
        description: "additional environment variables for build step"
        required: false
        default: ""
        type: string
      ref:
        description: "Git ref to build (default: triggering commit)"
        required: false
        default: ""
        type: string

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run content script tests
        run: node --test "scripts/*.test.mjs"

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Build application
        run: |
          # Export additional environment variables if provided
          export ${{ inputs.additional_build_env }}
          npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: static-export
          path: build/client/
          retention-days: 1
